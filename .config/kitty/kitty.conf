# ===== Window =====
hide_window_decorations titlebar-only
macos_show_window_title_in all
macos_titlebar_color background
background_opacity 0.9
background_blur 64
dynamic_padding yes
window_padding_width 6 6
initial_window_directory /Users/kashif

# ===== Startup =====
startup_session ~/.config/kitty/kitty-startup.session

# ===== Font =====
font_size 14.0

# Alacritty's font.offset.y = 1 -> nudge line height a touch
adjust_line_height 1
adjust_column_width 0

# ===== Cursor =====
cursor_shape underline
# Alacritty thickness 0.1 (fraction) ≈ very thin; kitty uses pixels
cursor_thickness 1.0
# Blink roughly "On" all the time
cursor_blink_interval 0.6
cursor_stop_blinking_after 0

# Bell
visual_bell_duration 0.15

# BEGIN_KITTY_THEME
# Arthur
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="GeistMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
