[window]
decorations = "none"
opacity = 1.0
dynamic_padding = true

[window.padding]
x = 8
y = 6

[font]
size = 14.0

[font.normal]
family = "GeistMono Nerd Font"
style = "Regular"

[font.bold]
family = "GeistMono Nerd Font"
style = "Bold"

[font.italic]
family = "GeistMono Nerd Font"
style = "Italic"

[font.offset]
x = 0
y = 1

[cursor]
thickness = 0.1

[cursor.style]
shape = "Underline"
blinking = "On"   # valid values: "Never", "Off", "On", "Always"

# --- Kitty → Alacritty colors ---
[colors.primary]
background = "0x1c1c1c"  # background
foreground = "0xddeedd"  # foreground

[colors.cursor]
cursor = "0xe2bbef"      # cursor
text   = "0x1c1c1c"      # pick text under cursor; matches selection_foreground vibe

[colors.normal]
black   = "0x3d352a"     # color0
red     = "0xcd5c5c"     # color1
green   = "0x86af80"     # color2
yellow  = "0xe8ae5b"     # color3
blue    = "0x6495ed"     # color4
magenta = "0xdeb887"     # color5
cyan    = "0xb0c4de"     # color6
white   = "0xbbaa99"     # color7

[colors.bright]
black   = "0x554444"     # color8
red     = "0xcc5533"     # color9
green   = "0x88aa22"     # color10
yellow  = "0xffa75d"     # color11
blue    = "0x87ceeb"     # color12
magenta = "0x996600"     # color13
cyan    = "0xb0c4de"     # color14
white   = "0xddccbb"     # color15

[colors.selection]
text       = "0x1c1c1c"  # selection_foreground
background = "0x4d4d4d"  # selection_background

[bell]
animation = "EaseOutExpo"
duration  = 150
color     = "0x89b4fa"

