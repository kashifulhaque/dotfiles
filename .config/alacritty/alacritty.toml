[window]
decorations = "none"
opacity = 1.0
dynamic_padding = true

[window.padding]
x = 8
y = 6

[font]
size = 14.0

[font.normal]
family = "GeistMono Nerd Font"
style = "Regular"

[font.bold]
family = "GeistMono Nerd Font"
style = "Bold"

[font.italic]
family = "GeistMono Nerd Font"
style = "Italic"

[font.offset]
x = 0
y = 1

[cursor]
thickness = 0.1

[cursor.style]
shape = "Underline"
blinking = "On"   # valid values: "Never", "Off", "On", "Always"

[colors.primary]
background = "0x1e1e2e"
foreground = "0xd9e0ee"

[colors.normal]
black   = "0x1e1e2e"
red     = "0xf38ba8"
green   = "0xa6e3a1"
yellow  = "0xf9e2af"
blue    = "0x89b4fa"
magenta = "0xf5c2e7"
cyan    = "0x94e2d5"
white   = "0xd9e0ee"

[colors.bright]
black   = "0x585b70"
red     = "0xf38ba8"
green   = "0xa6e3a1"
yellow  = "0xf9e2af"
blue    = "0x89b4fa"
magenta = "0xf5c2e7"
cyan    = "0x94e2d5"
white   = "0xffffff"

[colors.selection]
text       = "0x1e1e2e"
background = "0xf9e2af"

[bell]
animation = "EaseOutExpo"
duration  = 150
color     = "0x89b4fa"

